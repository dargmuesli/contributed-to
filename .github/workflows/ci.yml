name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - renovate/**

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@6989da1490699f854d6556dd2d9b862f5cbdd305 # 5.0.0
    permissions:
      pull-requests: read
  release_semantic_dry:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Release (semantic, dry)
    uses: dargmuesli/github-actions/.github/workflows/release-semantic.yml@6989da1490699f854d6556dd2d9b862f5cbdd305 # 5.0.0
    permissions:
      contents: write
      id-token: write
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    with:
      DRY_RUN: true
      EXTRA_PLUGINS: |
        semantic-release-replace-plugin
      GH_APP_ID: ${{ vars.GH_APP_ID }}
  build:
    name: Build
    uses: dargmuesli/github-actions/.github/workflows/docker.yml@6989da1490699f854d6556dd2d9b862f5cbdd305 # 5.0.0
    needs: release_semantic_dry
    permissions:
      packages: write
    with:
      ARTIFACT_PATH: .
      BUILD_TARGET_RELEASE: test
      TAG: ${{ needs.release_semantic_dry.outputs.new_release_version }}
  coverage:
    name: Upload Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: build-artifact
      - name: Extract coverage artifact
        run: |
          tar -xzf build-artifact.tar
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  release_semantic:
    needs: build
    name: Release (semantic)
    uses: dargmuesli/github-actions/.github/workflows/release-semantic.yml@6989da1490699f854d6556dd2d9b862f5cbdd305 # 5.0.0
    permissions:
      contents: write
      id-token: write
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    with:
      EXTRA_PLUGINS: |
        semantic-release-replace-plugin
      GH_APP_ID: ${{ vars.GH_APP_ID }}
