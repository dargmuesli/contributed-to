[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "responses==0.26.1",
    "ruff==0.15.15",
    "types-requests==2.33.0.20260518",
]

[project]
authors = [
    {name = "Jonas Thelemann"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "beautifulsoup4==4.14.3",
    "lxml==6.1.1",
    "requests==2.34.2",
]
description = "Extract and enrich GitHub pinned repository data from profile pins HTML"
keywords = ["github", "profile", "pins", "repositories", "api", "stats"]
license = {text = "MIT"}
name = "contributed-to"
readme = "README.md"
requires-python = ">=3.11"
version = "0.0.1"

[project.scripts]
contributed-to = "src.main:main"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "D203",    # One blank line before class (conflicts with D211)
    "D213",    # Multi-line summary second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Use of assert detected
    "PLR2004",  # Magic value used in comparison (test data is self-documenting)
    "PT022",    # Use return instead of yield (yield is fine for fixtures)
    "PLC0415",  # Import outside top-level (fixtures need delayed imports)
]

[tool.pytest.ini_options]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
